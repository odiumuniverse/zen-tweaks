name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://odiumuniverse.github.io/zen-tweaks
  ADDON_ID: zen-tweaks@odiumuniverse

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: OUT="$PWD/dist/zen-tweaks-$VERSION.xpi" ./build.sh

      # Zen checks updates.json and installs update_link when version grows
      - name: Assemble the site
        run: |
          mkdir -p public
          cp site/index.html public/
          cp "dist/zen-tweaks-$VERSION.xpi" public/
          cp "dist/zen-tweaks-$VERSION.xpi" public/zen-tweaks.xpi
          jq -n --arg id "$ADDON_ID" --arg version "$VERSION" \
            --arg link "$SITE_URL/zen-tweaks-$VERSION.xpi" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link}]}}}' \
            > public/updates.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/zen-tweaks-$VERSION.xpi" --generate-notes
